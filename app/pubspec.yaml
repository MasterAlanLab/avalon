name: avalon
description: "Avalon proxy client."
publish_to: 'none'
version: 2.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  av_core:
    path: ../packages/av_core
  av_design:
    path: ../packages/av_design
  material_symbols_icons: ^4.2960.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: '>=2.34.0 <2.35.0'
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  intl: ^0.20.2
  crypto: ^3.0.7
  # Direct, user-restricted Windows named-pipe transport (D124).
  ffi: ^2.2.0
  file_picker: ^13.1.0
  desktop_drop: ^0.8.0
  cross_file: ^0.3.5+5
  flutter_zxing: ^3.1.0
  camera: ^0.12.1
  share_plus: ^13.3.1
  # Desktop shell (RUNTIME_HOST §9): window and tray. Hotkeys and the
  # login item are our own (platform/desktop/).
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.34.0 <2.34.6"
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Licence texts shown on the About page that pub packages do not carry.
    - assets/licenses/
    # Tray and menu bar icons (desktop shell); tool/branding/render_icons.sh.
    - assets/tray/
