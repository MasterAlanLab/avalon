        deleted:
          type: boolean
          enum:
          - false
        schemaVersion:
          type: integer
          enum:
          - 1
        payload:
          $ref: '#/components/schemas/SyncNodePayload'
    SyncChainRecord:
      type: object
      additionalProperties: false
      required:
      - recordId
      - type
      - revision
      - editedAt
      - editedByDeviceId
      - deleted
      - schemaVersion
      - payload
      properties:
        recordId:
          $ref: '#/components/schemas/SyncRecordId'
        type:
          type: string
          enum:
          - chain
        revision:
          type: integer
          format: int64
          minimum: 1
