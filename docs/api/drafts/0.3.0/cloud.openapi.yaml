        serverTime:
          $ref: '#/components/schemas/UtcTimestamp'
      description: writeState=staged仅确认当前attempt暂存，结果只允许applied；published允许原schema1的applied或superseded。原结果重放保持首次上下文，不改变当前attempt。
    SyncV2PullResponse:
      type: object
      additionalProperties: false
      required:
      - syncGeneration
      - rebuildAttemptId
      - records
      - nextCursor
      - hasMore
      - serverTime
      - headRevision
      properties:
        syncGeneration:
          $ref: '#/components/schemas/SyncGeneration'
