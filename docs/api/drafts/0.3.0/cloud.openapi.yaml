          $ref: '#/components/schemas/OpaqueId'
        deleted:
          type: boolean
          enum:
          - false
        schemaVersion:
          type: integer
          enum:
          - 1
        payload:
          $ref: '#/components/schemas/SyncChainPayload'
    SyncPolicyRecord:
      type: object
