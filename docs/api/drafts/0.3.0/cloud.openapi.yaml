openapi: 3.0.3
info:
  title: Avalon Cloud 客户端公开接口
  version: 0.3.0
  x-contract-status: draft-not-released-development-preview
  description: 评审草案：同步协议2，账号同步代次、到期保留及独立重建区。首七账号操作及其可达wire定义与0.2.0完全一致。未替代现行唯一契约，禁止生产启用。固定UTC30天与服务端统一加密／普通受控灾备政策已于2026-10-14获用户确认；生产实现与验收仍受门禁约束。删除保证的明确替代见顶层x-policy及本目录SYNC_PROTOCOL.md。
x-contract-status: draft-not-released-development-preview
x-canonical-path: docs/api/drafts/0.3.0/cloud.openapi.yaml
x-contract-scope: account-first-batch-unchanged-and-sync-protocol-2-draft
x-sources:
- docs/CLOUD_SYNC.md §3、§4、§8、§9、§11
- docs/PRODUCT_SPEC.md §3.14
- docs/DECISIONS.md D96/D98/D100; docs/api/SYNC_PROTOCOL.md
x-policy:
  decision: D100
  approvedAt: '2026-10-14'
  status: approved-policy-development-preview-not-released
  scope: 仅显式采用本新版服务端管理加密政策的协议2账号；未迁移0.2.0账号继续旧承诺。
  precedence: 本节及SYNC_PROTOCOL.md第1.1节明确替代所适用账号的0.2.0不可恢复销毁要求，以及为保持首七操作对象逐字相同而保留的deleteAccount说明中“销毁账号数据密钥”的旧保证；wire定义不变，删除成功只确认在线删除和独立UUID拒绝，不证明灾备不可解密或已清除。
  encryption: 服务端管理云端内容的账号隔离加密，保证账号、代次、尝试与记录上下文的完整性及用途隔离；用户无需保管云端密钥，客户端本机主密钥不上传；缺钥或完整性失败拒绝相应处理。
  disasterBackupRetentionSeconds: 2592000
  disasterBackupRetentionClock: 从每份备份原始UTC创建时刻计算固定30天；复制、轮转或恢复不重置原期限。
  deletion: 立即清除在线账号关联数据和相应在线密钥资源，持续拒绝不可复用账号UUID；保留期内灾备仍可能恢复解密，到期清除全部受控副本，不承诺即时或最终密码学不可解密。
  restore: 恢复旧资料不得撤回最新删除或退休事实；恢复后拒绝已删账号、保持退休空间关闭并失效旧登录凭据，要求重新认证；单账号清理不影响其他账号。
  cleanupKeyStates: deleted仅表示在线密钥资源移除，不表示灾备清除；destroyed仅保留旧模式不可逆拒绝含义，不用于本新版政策的完成状态。
  compatibility: 协议头仍为2；客户端必须完整识别deleted并拒绝未知枚举；采用本新版加密政策的账号拒绝协议1同步，既有账号未经政策迁移保持原承诺。
x-open-questions:
- id: delete-idempotency
  question: 删除账号成功响应丢失后的恢复证明尚待双方确认；设备重复移除已确定为 404，该响应不能证明首次删除成功。
  currentRule: 删除账号撤销全部会话，401 不作为删除成功证明；移除设备撤销该设备全部会话，已移除、未知及跨账号目标统一 404 NOT_FOUND。
- id: production-encryption-and-restore
  question: 服务端管理加密与恢复隔离、真实购买核验、客户端兼容及新版本正式发布仍须分别验收。
  currentRule: 服务端管理加密与普通受控备份政策已确认；候选协议与摘要检查不替代双端、适用真机及安全验收。
- id: retention-migration
  question: 历史到期账号一次性通知／过渡截止及旧协议拒绝启用日待发布计划确定。
  currentRule: 不重写购买expiresAt，不自动删现有数据。
- id: rebuild-user-flow
  question: 重建设备选择、接管／取消确认、待合并项与清理阶段文案待产品评审。
  currentRule: 客户端不得静默选设备、整镜像回灌或把清理日期当物理删除证明。
