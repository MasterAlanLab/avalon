        '400':
          $ref: '#/components/responses/SyncV2Error400'
        '401':
          $ref: '#/components/responses/SyncV2Error401'
        '402':
          $ref: '#/components/responses/SyncV2Error402'
        '409':
          $ref: '#/components/responses/SyncV2Error409'
        '413':
          $ref: '#/components/responses/SyncV2Error413'
        '415':
          $ref: '#/components/responses/SyncV2Error415'
        '426':
          $ref: '#/components/responses/SyncV2Error426'
        '429':
          $ref: '#/components/responses/SyncV2Error429'
        '500':
          $ref: '#/components/responses/SyncV2Error500'
        '503':
          $ref: '#/components/responses/SyncV2Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncV2ActivateRequest'
  /v1/sync/push:
    post:
      operationId: pushSyncV2
      x-contract-status: draft-not-released-development-preview
      tags:
