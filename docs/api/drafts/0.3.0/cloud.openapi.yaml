    SyncV2ManifestEntry:
      type: object
      additionalProperties: false
      required:
      - recordId
      - type
      - mutationId
      properties:
        recordId:
          $ref: '#/components/schemas/SyncRecordId'
        type:
          $ref: '#/components/schemas/SyncRecordType'
        mutationId:
          $ref: '#/components/schemas/SyncUuid'
      description: 对应且只对应一个baseRevision=0、deleted=false的schema1暂存mutation；recordId和mutationId在manifest内均唯一。
    SyncV2Manifest:
      type: object
      additionalProperties: false
      required:
      - manifestId
      - entries
      properties:
        manifestId:
          $ref: '#/components/schemas/SyncUuid'
        entries:
          type: array
          minItems: 0
