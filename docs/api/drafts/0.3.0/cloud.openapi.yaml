          items:
            $ref: '#/components/schemas/SyncRecord'
          maxItems: 500
        nextCursor:
          $ref: '#/components/schemas/SyncRevision'
        hasMore:
          type: boolean
        serverTime:
          $ref: '#/components/schemas/UtcTimestamp'
        headRevision:
          $ref: '#/components/schemas/SyncRevision'
