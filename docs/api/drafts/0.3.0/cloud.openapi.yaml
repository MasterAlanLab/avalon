        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        editedAt:
          $ref: '#/components/schemas/SyncEpochMillis'
        editedByDeviceId:
          $ref: '#/components/schemas/OpaqueId'
        deleted:
          type: boolean
          enum:
          - false
        schemaVersion:
          type: integer
          enum:
          - 1
        payload:
          $ref: '#/components/schemas/SyncConfigurationPayload'
    SyncNodeRecord:
      type: object
