      summary: 正式空间或显式attempt的连续前缀上传
      description: 必须遵循同目录SYNC_PROTOCOL.md；只由已验证Bearer/JWT决定账号、会话及设备，客户端标识不授予权限。未发布、禁止生产启用。
      parameters:
      - $ref: '#/components/parameters/SyncV2ProtocolVersion'
      responses:
        '200':
          description: 成功；业务JSON，必须遵循本目录规范。
          headers:
            Avalon-Sync-Version:
              description: 本草案同步成功及错误响应固定为2；客户端必须核验成功响应，不匹配不得应用。
              required: true
              schema:
                type: string
                enum:
                - '2'
            Cache-Control:
              description: 全部同步状态、控制、数据和错误响应禁止缓存。
              required: true
