          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        editedAt:
          $ref: '#/components/schemas/SyncEpochMillis'
      description: editedAt 是首次处理时服务端截断后的有效时间，重试不重新计算。
    SyncSupersededResult:
      type: object
      additionalProperties: false
      required:
