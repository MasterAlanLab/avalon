          $ref: '#/components/schemas/OpaqueId'
        deviceId:
          $ref: '#/components/schemas/OpaqueId'
        syncGeneration:
          type: string
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          minLength: 36
          nullable: true
        spaceState:
          $ref: '#/components/schemas/SyncV2SpaceState'
        backupState:
          $ref: '#/components/schemas/SyncV2BackupState'
        entitlementExpiresAt:
