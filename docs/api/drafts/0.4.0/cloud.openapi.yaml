          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
              description: 新增认证与账务接口的稳定错误码；按code分支，未知code按HTTP状态处理，不解析message。不复用首七账号接口的封闭ErrorCode枚举。
            message:
              type: string
              description: 脱敏诊断文案；客户端不得依靠内容或语言解析业务状态。
  responses:
    IntegrationBadRequest:
      description: 参数校验失败为VALIDATION；第三方身份、attempt秘密、浏览器cookie或confirmationToken无效为INVALID_PROVIDER_PROOF。不会附邮箱challenge的reason。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    IntegrationUnauthorized:
      description: AUTH_REQUIRED或SESSION_REVOKED；当前登录凭据无效或会话已撤销。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    IntegrationConflict:
      description: LOGIN_ATTEMPT_UNAVAILABLE、SUBSCRIPTION_EXISTS、IDEMPOTENCY_CONFLICT、PURCHASE_CONTEXT_EXPIRED、PURCHASE_NOT_STARTED、PURCHASE_OWNED_BY_OTHER、PURCHASE_UNVERIFIED、BILLING_VERIFICATION_SUPERSEDED或BILLING_RECONCILIATION_REQUIRED；读取当前状态后继续原流程或重新开始，不盲目创建第二笔购买。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    IntegrationUnavailable:
      description: PROVIDER_NOT_CONFIGURED、PROVIDER_UNAVAILABLE或BILLING_VERIFICATION_PENDING；资源缺失、渠道临时不可用或核验未知，不产生权益。提供Retry-After时按其等待。
      headers:
        Retry-After:
          description: 可选的重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    IntegrationPayloadTooLarge:
      description: 请求正文超过64KiB；error.code为VALIDATION。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    IntegrationUnsupportedMediaType:
      description: JSON接口要求application/json；error.code为VALIDATION。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    IntegrationInternalError:
      description: 脱敏内部失败；error.code为INTERNAL_ERROR，不返回渠道凭据、SQL或stack。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationError'
    ValidationError:
      description: 请求参数或 challenge 校验失败；error.code 为 VALIDATION。仅邮箱 challenge 校验附 error.reason，普通参数校验无 reason；具体尝试和终止规则见
        email/verify。
      x-contract-status: accepted-first-batch
      x-error-codes:
      - VALIDATION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CloudError'
    AuthenticationError:
      description: 'error.code 为 AUTH_REQUIRED 或 SESSION_REVOKED。

