          type: string
          enum:
          - superseded
        record:
          $ref: '#/components/schemas/SyncRecord'
      description: 返回首次处理时完整胜出记录，包含墓碑；七天内重放仍是这个原结果。
    SyncPushResult:
      oneOf:
      - $ref: '#/components/schemas/SyncAppliedResult'
      - $ref: '#/components/schemas/SyncSupersededResult'
