  seconds: 2592000
  status: approved-2026-10-13-implemented-server
  clock: server-UTC
  start: verified-entitlement-expiresAt
x-auth-billing-policy:
  approvedAt: '2026-10-15'
  operator: Avalon LLC, New Mexico, United States
  subscription: 每账号仅一项当前订阅，跨渠道预留与start串行化；有效渠道服务段不累加重叠天数。外部重订或迟到支付形成的真实冲突必须记录和处理，不隐瞒重复收费。
  repurchase: 已删账号的旧服务段不转移；渠道证明新购买和新绑定，且旧整链任务已解决，才可将未来新付费段归新账号。自动续费或restore不是新购买。
  receipt: 回执只在原attempt绝对期限内恢复（native固定5分钟、web固定10分钟）；ACK、refresh、logout、设备移除、会话替换及删号关闭回执。浏览器poll不返回令牌，claim方持有独立secret。
  retirement: 从空间持久E/R按真实establishedAt逐段重放。严格早于当时R的续费才能延续；历史不全或购买集合版本变化暂停，不退休。
  restore: 恢复旧资料不得撤回购买归属、未决操作及版本事实；旧凭据和attempt失效，待决购买重新核验；未经权威渠道核验不得按旧active投影开放同步。
  retainedBillingRecords: 删号不释放旧交易归属；最小归属、交易、反滥用和未决外部任务保留用于防止恢复旧购买及处理账务，和30天云端内容备份保留不是同一类记录。
  resources: 渠道未配置返回PROVIDER_NOT_CONFIGURED，不签发测试权益，不阻断其他已配置渠道和邮箱登录。
