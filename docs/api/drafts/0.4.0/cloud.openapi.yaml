      type: object
      additionalProperties: false
      required:
      - results
      - processedCount
      - hasMore
      - serverTime
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncPushResult'
          maxItems: 100
          minItems: 1
        processedCount:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
        serverTime:
          $ref: '#/components/schemas/UtcTimestamp'
      description: results 是输入mutation的已提交连续前缀，processedCount等于其长度；hasMore=(processedCount<请求数量)。完整正文不超过64MiB，尾部尚未处理，保留原mutationId续传。
    SyncPullResponse:
      type: object
      additionalProperties: false
      required:
      - records
      - nextCursor
      - hasMore
      - serverTime
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncRecord'
          maxItems: 500
        nextCursor:
          $ref: '#/components/schemas/SyncRevision'
        hasMore:
          type: boolean
        serverTime:
          $ref: '#/components/schemas/UtcTimestamp'
      description: 按revision严格递增；nextCursor等于最后返回记录revision，空页等于输入cursor。响应最多64MiB，hasMore只表示同一读取快照还有记录。
    SyncErrorCode:
      type: string
      enum:
      - AUTH_REQUIRED
      - SESSION_REVOKED
      - NO_ENTITLEMENT
      - DEVICE_LIMIT
      - SCHEMA_UNSUPPORTED
      - RATE_LIMITED
      - VALIDATION
      - INTERNAL_ERROR
      - SYNC_NOT_ACTIVE
      - SYNC_QUOTA_EXCEEDED
