          type: array
          items:
            $ref: '#/components/schemas/SyncMutation'
          maxItems: 100
          minItems: 1
      description: 最多100条且全部正文最多64MiB。完整批次先校验，再逐mutation原子提交；mutationId及recordId在同一批次均不得重复。
    SyncAppliedResult:
