      description: 按revision严格递增；nextCursor等于最后返回记录revision，空页等于输入cursor。响应最多64MiB，hasMore只表示同一读取快照还有记录。
    SyncErrorCode:
      type: string
      enum:
      - AUTH_REQUIRED
      - SESSION_REVOKED
      - NO_ENTITLEMENT
      - DEVICE_LIMIT
      - SCHEMA_UNSUPPORTED
      - RATE_LIMITED
      - VALIDATION
      - INTERNAL_ERROR
      - SYNC_NOT_ACTIVE
      - SYNC_QUOTA_EXCEEDED
    SyncCloudError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/SyncErrorCode'
            message:
              type: string
              maxLength: 512
      description: 仅同步操作的固定错误集合；不扩改0.1.1账号错误schema，不含payload、URL、密钥、SQL或stack。
  responses:
    ValidationError:
      description: 请求参数或 challenge 校验失败；error.code 为 VALIDATION。仅邮箱 challenge 校验附 error.reason，普通参数校验无
        reason；具体尝试和终止规则见 email/verify。
      x-contract-status: accepted-first-batch
      x-error-codes:
      - VALIDATION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CloudError'
    AuthenticationError:
      description: 'error.code 为 AUTH_REQUIRED 或 SESSION_REVOKED。

        access token 失效可由客户端触发一次合并的刷新；refresh 无效或会话撤销时转为退出状态。refresh 错误优先级与 logout 凭据校验见对应操作描述，不把已撤销会话概括为自然到期
        AUTH_REQUIRED。

        logout 的未知 401 不证明撤销成功，待撤销项仍保留；依据 proof 原到期时间确认失效时清除队列项并报告 CloudRevocationUnavailableException，远端撤销未获确认。

        客户端保留本机内容与代理凭据，不得因 Cloud 鉴权失败阻断本地功能。

        '
      x-contract-status: accepted-first-batch
      x-error-codes:
      - AUTH_REQUIRED
      - SESSION_REVOKED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CloudError'
    RateLimitedError:
      description: error.code 为 RATE_LIMITED；Retry-After 给出从当前响应起应等待的整数秒数。
      x-contract-status: accepted-first-batch
      x-error-codes:
      - RATE_LIMITED
      headers:
