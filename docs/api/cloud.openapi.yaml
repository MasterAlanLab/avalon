paths:
  /v1/auth/email/start:
    post:
      operationId: startEmailChallenge
      x-contract-status: accepted-first-batch
      tags:
      - auth
      summary: 发送邮箱验证码
      description: '不以响应透露账号是否存在；成功时返回 challengeId 与 expiresAt。

        expiresAt 为服务端当前时间加 10 分钟的 UTC RFC3339 时间。

        验证码为 6 位，10 分钟有效；每个 challenge 最多验证 5 次。

        同一邮箱每小时最多发送 5 次，同一 IP 每小时最多发送 100 次。

        限流应与账号存在性无关；限流错误使用 429 RATE_LIMITED。小时配额 Retry-After 为 3600 秒，通用 HTTP 限流为 60 秒。

        成功发送不增加 60 秒冷却或 resendAfter。expiresAt 不是重发限制；重发仅依据 429 的 Retry-After 等待。

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailStartRequest'
      responses:
        '200':
          description: 已受理验证码请求；响应形状不反映账号存在性。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailStartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailChallenge
      x-contract-status: accepted-first-batch
      tags:
      - auth
      summary: 验证邮箱验证码并登录
      description: 'code 必须作为字符串传输，以保留前导零。服务端消费有效 challenge 并绑定安装设备。

        设备按 accountId 与 installationId 查找或创建；会话绑定该设备。

        登录本身不要求付费，也不占用同步设备名额；付费同步另由 sync/activate 激活。

        登录响应以及所有令牌写入客户端加密秘密表。

        challenge 校验失败返回 400 VALIDATION，error.reason 为 wrongCode、expired、attemptsExceeded、consumed 或 missing；普通参数校验不附
        reason。

        前四次错码为 wrongCode，第五次错码为 attemptsExceeded，第五次正确仍可成功。已消费、过期或耗尽的 challenge 不再计尝试，未知 challenge 为 missing。

        expired 表示服务端当前时间达到 expiresAt；客户端显示服务器状态，不以本机时钟代替服务器校验。多个终止条件同时成立的裁决顺序不在本增量中另作规定。

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '200':
          description: 登录成功；返回当前会话的令牌与身份绑定。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      x-contract-status: accepted-first-batch
      tags:
      - auth
      summary: 轮换当前会话的令牌
      description: '通过请求体中的 refresh token 认证，不依赖尚有效的 access token。

        access token 为 JWT，有效期 15 分钟，携带 accountId、deviceId、sessionId。

        refresh token 为不透明随机串，有效期 90 天；每次刷新轮换并顺延期限。

        无法识别的 refresh token 返回 401 AUTH_REQUIRED；可识别会话已撤销时优先返回 401 SESSION_REVOKED。

        非撤销会话自然到期返回 401 AUTH_REQUIRED。会话仍有效时，已消费的旧 refresh 被重放返回 401 SESSION_REVOKED 并撤销整个会话；此检查优先于该旧
        token 自身到期检查。

        非撤销、未消费的 token 自然到期返回 401 AUTH_REQUIRED。自然到期判断包含到期时刻本身；客户端禁止自动重试旧 token。

        客户端将同一会话的并发刷新合并为一次，并将新令牌对原子写入加密秘密表。

        刷新已成功但响应丢失时的恢复方案为待协商事项；本稿不提供宽限期或幂等例外。

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 同一会话的令牌已轮换，返回新令牌对。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/logout:
    post:
      operationId: logoutSession
      x-contract-status: accepted-first-batch
      tags:
      - auth
      summary: 撤销目标会话或提交待撤销证明
      description: '可使用 Bearer 或 JSON refreshToken proof。只要提供 Bearer，就先校验 JWT；无效或已到期的 Bearer 优先返回 401
        AUTH_REQUIRED，即使 body proof 有效也不能忽略该错误。

        body proof 可以是当前或已轮换的旧 refresh，仅证明撤销其原会话，不能登录、刷新或用于其他受保护接口。proof 有效期以该 token 发放时的原 refreshExpiresAt
        为准；会话后续刷新不会延长旧 proof。now >= 原 refreshExpiresAt 时返回 401 AUTH_REQUIRED。

        Bearer 与 proof 同时提供且均有效时，必须属于同一会话；不同会话返回 400 VALIDATION，不撤销任何一方。proof-only 不得附加新会话 Bearer。

        通过本操作凭据校验后，已撤销目标重复调用返回 204；未过期 proof 的重复撤销可幂等成功，已到期 proof 不因目标已撤销而返回 204。

        客户端先原子加密保存待撤销 proof 及其原 refreshExpiresAt，再清除活动令牌。旧队列缺少到期字段时兼容为 null，不把缺字段当作已过期。服务器明确返回 proof-only
        的 401 AUTH_REQUIRED 时清除该项并抛 CloudRevocationUnavailableException，表示远端撤销未获确认；不能作为远端撤销成功，也不能只凭本机时钟提前丢弃
        proof。未知或畸形 401、网络错误保留待撤销项。

        补撤销使用 proof-only；应用启动、回前台与网络恢复的自动重试接线仍待完整 Cloud UI 实现，不由首批接口基础层承诺已自动补发。退出保留本机内容与代理凭据。'
      responses:
        '204':
          description: 当前会话已撤销，无响应正文。
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - BearerAuth: []
      - {}
      x-authentication-rule: 校验已提供的 Bearer 优先；proof 须未到其原 refreshExpiresAt；同时提供的有效凭据须指向同一会话
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutProofRequest'
  /v1/account:
    get:
      operationId: getAccount
      x-contract-status: accepted-first-batch
      tags:
      - account
      summary: 获取当前账号、权益与设备快照
      description: 从有效 Bearer 会话获取当前账号快照，包括全部持有有效会话的设备和本机 deviceId。deviceLimit=10，只有 syncActive=true 占名额。免费账号返回
        entitlement=null、syncActiveDeviceCount=0。entitlement.status 为 active/expired/revoked，取消续费但未到期仍
        active。所有字段来自一致快照。
      responses:
        '200':
          description: 当前账号快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAccount
      x-contract-status: accepted-first-batch
      tags:
      - account
      summary: 删除当前账号与云端数据
      description: '要求当前会话有效，客户端已完成两次确认。只从 Bearer 会话确定要删除的账号。

        服务端撤销全部会话，删除同步记录、设备、身份和邮箱，销毁账号数据密钥。

        购买记录按财税要求匿名保留。客户端保留本机内容与代理凭据。

        删除账号不会代替用户到购买渠道取消订阅；响应提供结构化取消提醒信息。

        本稿未定义删除成功后响应丢失的重试鉴权结果。

        '
      responses:
        '200':
          description: 账号已删除；客户端依据结构化字段显示渠道取消订阅提醒。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/devices/{id}:
    delete:
      operationId: removeDevice
      x-contract-status: accepted-first-batch
      tags:
      - devices
      summary: 移除当前账号下的设备
      description: 移除当前账号的非本机设备，撤销它的全部会话并释放同步名额。未知、跨账号或已移除的 deviceId 一律 404 NOT_FOUND，重复移除不返回 204；404
        不能证明首次删除成功。本机设备 400 VALIDATION，退出本机应使用 logout。目标设备下一请求 401，保留本机数据。授权与写入同事务，所有受保护请求检查会话撤销状态。
      parameters:
      - name: id
        in: path
        required: true
        description: 待移除设备的不透明标识。
        schema:
          $ref: '#/components/schemas/OpaqueId'
      responses:
        '204':
          description: 目标设备全部会话已撤销且同步名额已释放，无响应正文。
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /v1/sync/activate:
    post:
      operationId: activateSync
      x-contract-status: design-frozen-not-implemented
      tags:
      - sync
      summary: 激活当前登录设备的同步
      description: 必须遵循 SYNC_PROTOCOL.md 的全部规范性约束。账号/设备/会话取自已验证JWT，绝不接受客户端授权声明。生产尚未开放。 请求不得携带正文或query；对当前已激活设备幂等成功。权益到期保留标记但禁止同步，续期后可恢复。
      security:
      - BearerAuth: []
      parameters:
      - name: Avalon-Sync-Version
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
        description: 同步语义版本，固定为1；缺失或不支持返回426 SCHEMA_UNSUPPORTED。与OpenAPI文档版本、数据库版本无关。
      responses:
        '200':
          description: 成功；直接业务JSON。
