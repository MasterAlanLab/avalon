          description: 最短等待秒数，本草案只使用秒数形式，不使用 HTTP-date。
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CloudError'
    InternalError:
      description: 脱敏内部/框架失败；error.code 为 INTERNAL_ERROR。
