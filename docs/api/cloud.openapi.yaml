                $ref: '#/components/schemas/SyncActivateResponse'
        '400':
          $ref: '#/components/responses/SyncError400'
        '401':
          $ref: '#/components/responses/SyncError401'
        '402':
          $ref: '#/components/responses/SyncError402'
        '409':
          $ref: '#/components/responses/SyncError409'
        '413':
          $ref: '#/components/responses/SyncError413'
        '415':
          $ref: '#/components/responses/SyncError415'
        '426':
          $ref: '#/components/responses/SyncError426'
