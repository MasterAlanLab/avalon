name: 问题反馈 / Bug report
title: "[BUG] "
description: 反馈你遇到的问题 / Report the issue you are experiencing

body:
  - type: markdown
    attributes:
      value: |
        请先搜索[已有问题](https://github.com/MasterAlanLab/avalon/issues?q=is%3Aissue)，使用简短标题，并填写版本、复现步骤及相关日志。
        分享截图、日志或配置前，请移除密码、订阅令牌、Auth Key、完整授权链接和身份文件。

        Search [existing issues](https://github.com/MasterAlanLab/avalon/issues?q=is%3Aissue), use a concise title, and include the version, reproduction steps, and relevant logs.
        Remove passwords, subscription tokens, auth keys, full authorization URLs, and identity files from shared material.
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Describe the bug
      description: 详细清晰地描述你遇到的问题，并配合截图 / Describe the problem you encountered in detail and clearly, and provide screenshots
    validations:
      required: true
  - type: textarea
    attributes:
      label: 软件版本 / Version
      description: 请提供Avalon的具体版本 / Please provide the specific version of Avalon.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤 / To Reproduce
      description: 请提供复现问题的步骤 / Steps to reproduce the behavior
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 操作系统 / OS
      options:
        - Android
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    attributes:
      label: 操作系统版本 / OS Version
      description: 请提供你的操作系统版本，Linux请额外提供桌面环境及窗口系统 / Please provide your OS version, for Linux, please also provide the desktop environment and window system
    validations:
      required: true
  - type: textarea
    attributes:
      label: 相关日志 / Relevant logs
      description: 在工具 → 基础配置 → 日志等级选择 debug，复现后粘贴相关日志并移除凭据 / Select debug in Tools → Basic configuration → Log level, reproduce the issue, and paste relevant logs with credentials removed.
    validations:
      required: true
