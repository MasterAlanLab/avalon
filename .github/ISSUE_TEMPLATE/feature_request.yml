name: 功能请求 / Feature request
title: "[Feature] "
description: 提出你的功能请求 / Propose your feature request

body:
  - type: markdown
    attributes:
      value: |
        请先搜索[已有请求](https://github.com/MasterAlanLab/avalon/issues?q=is%3Aissue)，使用简短标题，并描述需要解决的问题和使用场景。

        Search [existing requests](https://github.com/MasterAlanLab/avalon/issues?q=is%3Aissue), use a concise title, and describe the problem and use case.

  - type: textarea
    id: description
    attributes:
      label: 功能描述 / Feature description
      description: 详细清晰地描述你的功能请求 / A clear and concise description of what the feature is
    validations:
      required: true
  - type: textarea
    attributes:
      label: 使用场景 / Use case
      description: 请描述你的功能请求的使用场景 / Please describe the use case of your feature request
    validations:
      required: true
  - type: checkboxes
    id: os-labels
    attributes:
      label: 适用系统 / Target OS
      description: 请选择该功能适用的操作系统（至少选择一个） / Please select the operating system(s) for this feature request (select at least one)
      options:
        - label: Android
        - label: Windows
        - label: macOS
        - label: Linux
    validations:
      required: true
